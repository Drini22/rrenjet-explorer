<title>Rrënjët Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --page:#f7f6f2; --surface:#fcfcfb; --panel:#f1f0ea;
  --ink:#161511; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(22,21,17,.10);
  --accent:#a3242a; --accent-ink:#ffffff; --accent-soft:rgba(163,36,42,.09);
  --map-land:#edece5; --map-line:#d4d3ca;
  --mig-zone:rgba(120,110,85,.12); --mig-state:rgba(70,90,120,.11);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --sO:#77756e;
  --shadow:0 1px 2px rgba(22,21,17,.05), 0 4px 16px rgba(22,21,17,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --panel:#232321;
    --ink:#f2f1ec; --ink2:#c3c2b7; --muted:#8f8d85;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10);
    --accent:#e0565a; --accent-ink:#160707; --accent-soft:rgba(224,86,90,.14);
    --map-land:#222220; --map-line:#343431;
    --mig-zone:rgba(215,205,175,.09); --mig-state:rgba(130,160,205,.11);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --sO:#8a887f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --panel:#232321;
  --ink:#f2f1ec; --ink2:#c3c2b7; --muted:#8f8d85;
  --grid:#2c2c2a; --border:rgba(255,255,255,.10);
  --accent:#e0565a; --accent-ink:#160707; --accent-soft:rgba(224,86,90,.14);
  --map-land:#222220; --map-line:#343431;
  --mig-zone:rgba(215,205,175,.09); --mig-state:rgba(130,160,205,.11);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --sO:#8a887f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:1240px; margin:0 auto; padding:0 24px 80px; }

/* ---------- header ---------- */
header.hero { padding:44px 0 8px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
.hero .eyebrow { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.hero h1 { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(34px, 5vw, 52px); line-height:1.04; margin:0 0 10px; text-wrap:balance; }
.hero .sub { color:var(--ink2); max-width:58ch; margin:0; }
.hero .sub a { color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; }
.lang-toggle { display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--surface); flex:none; }
.lang-toggle button { border:0; background:transparent; color:var(--ink2); font:inherit; font-weight:600; font-size:13px; padding:7px 16px; cursor:pointer; }
.lang-toggle button.on { background:var(--accent); color:var(--accent-ink); }

/* ---------- stats ---------- */
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin:28px 0 18px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 18px; box-shadow:var(--shadow); }
.stat .v { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:30px; line-height:1.1; }
.stat .v small { font-size:15px; color:var(--muted); font-family:"Instrument Sans", system-ui, sans-serif; font-weight:500; }
.stat .k { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:3px; }

/* ---------- filter bar ---------- */
.filters { position:sticky; top:0; z-index:30; background:var(--page); padding:10px 0 12px; border-bottom:1px solid var(--grid); margin-bottom:26px; }
.filters .row1 { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.filters input[type=search] { flex:1 1 220px; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ink); font:inherit; padding:8px 12px; }
.filters input[type=search]:focus, .filters select:focus { outline:2px solid var(--accent); outline-offset:1px; }
.filters select { background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--ink); font:inherit; padding:8px 10px; max-width:200px; }
.chip { border:1px solid var(--border); background:var(--surface); color:var(--ink2); border-radius:999px; font:inherit; font-size:13px; font-weight:500; padding:6px 13px; cursor:pointer; }
.chip:hover { border-color:var(--muted); }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chip .n { opacity:.65; font-size:12px; margin-left:4px; font-variant-numeric:tabular-nums; }
.active-chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.active-chips:empty { display:none; }
.fchip { display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft); color:var(--accent); border:1px solid transparent; border-radius:999px; font-size:13px; font-weight:600; padding:5px 12px; cursor:pointer; }
.fchip .x { font-weight:700; }
.clear-btn { border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; }

/* ---------- cards ---------- */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:stretch; }
@media (max-width: 1020px) { .grid2 { grid-template-columns:1fr; } }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:20px 22px 22px; margin-bottom:20px; min-width:0; }
.card h2 { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:21px; margin:0 0 2px; }
.card .desc { color:var(--muted); font-size:13.5px; margin:0 0 14px; }
.scroll-x { overflow-x:auto; }

/* ---------- sunburst ---------- */
.crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:4px; min-height:30px; margin-bottom:6px; font-size:13px; font-weight:600; }
.crumbs button { border:0; background:var(--panel); color:var(--ink2); font:inherit; font-size:13px; font-weight:600; border-radius:6px; padding:3px 9px; cursor:pointer; }
.crumbs button:hover { color:var(--ink); }
.crumbs .sep { color:var(--muted); }
.crumbs .here { background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:3px 9px; }
#sunburst { display:block; width:100%; height:auto; }
#sunburst path.arc { cursor:pointer; }
#sunburst text { pointer-events:none; }
.fis-panel { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; }
.fis-panel:empty { display:none; }
.fis-panel .fp-label { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
.fp-chip { border:1px solid var(--border); background:var(--panel); color:var(--ink2); border-radius:999px; font:inherit; font-size:12.5px; font-weight:500; padding:3px 11px; cursor:pointer; }
.fp-chip:hover { border-color:var(--muted); }
.fp-chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.fp-chip .n { opacity:.65; font-size:11.5px; margin-left:3px; font-variant-numeric:tabular-nums; }
.fp-more { color:var(--muted); font-size:12px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; }
.lg { display:inline-flex; align-items:center; gap:7px; border:0; background:transparent; color:var(--ink2); font:inherit; font-size:13px; font-weight:500; cursor:pointer; padding:2px 4px; border-radius:6px; }
.lg:hover { background:var(--panel); }
.lg .sw { width:11px; height:11px; border-radius:3px; flex:none; }
.lg .n { color:var(--muted); font-variant-numeric:tabular-nums; }
.lg.dim { opacity:.4; }

/* ---------- map ---------- */
#map { display:block; width:100%; height:auto; }
#map .qgroup { cursor:pointer; }
#map .country-label { fill:var(--muted); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; pointer-events:none; }

/* ---------- chronology ---------- */
#chrono { display:block; width:100%; height:auto; min-width:760px; }
#chrono .crow { cursor:pointer; }
#chrono .crow text.cname { font-size:12px; font-weight:600; fill:var(--ink2); }
#chrono .crow.sel text.cname { fill:var(--accent); }
#chrono .crow.dim { opacity:.35; }
#chrono .era-label { fill:var(--muted); font-size:9.5px; font-weight:600; letter-spacing:.1em; }
#chrono .yr-label { fill:var(--muted); font-size:9.5px; }
#chrono .cpill { font-size:11.5px; fill:var(--ink2); font-variant-numeric:tabular-nums; }

/* ---------- migration map ---------- */
.mig-slider { margin:4px 0 16px; }
.mig-slider input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
.mig-stops { display:flex; justify-content:space-between; margin-top:2px; }
.mig-stops button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; padding:2px 2px; border-radius:4px; }
.mig-stops button.on { color:var(--accent); }
.mig-grid { display:grid; grid-template-columns:1.55fr 1fr; gap:18px; align-items:start; }
@media (max-width:1020px){ .mig-grid { grid-template-columns:1fr; } }
#migmap { display:block; width:100%; height:auto; min-width:520px; background:var(--page); border-radius:10px; }
#migmap .land { fill:var(--map-land); stroke:var(--map-line); stroke-width:.7; }
#migmap .zone-cult { fill:var(--mig-zone); stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4; opacity:.9; }
#migmap .zone-state { fill:var(--mig-state); stroke:var(--ink2); stroke-width:1.2; opacity:.85; }
#migmap .zone-focus { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
#migmap .zone-label { fill:var(--ink2); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; paint-order:stroke; stroke:var(--page); stroke-width:3; }
#migmap .arrow-label { font-size:11px; font-weight:600; fill:var(--ink); paint-order:stroke; stroke:var(--page); stroke-width:3.5; }
.mig-story { background:var(--panel); border-radius:10px; padding:16px 18px; max-height:560px; overflow-y:auto; }
.mig-story h3 { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:19px; margin:0; }
.mig-story .yrs { color:var(--accent); font-size:12.5px; font-weight:600; letter-spacing:.06em; margin:2px 0 10px; }
.mig-story .summ { color:var(--ink2); font-size:13.5px; margin:0 0 14px; }
.mig-story .mstory { margin-bottom:13px; }
.mig-story .mstory p { margin:5px 0 0; font-size:13px; color:var(--ink2); line-height:1.5; }
.mig-chip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:999px; font:inherit; font-size:12.5px; font-weight:600; padding:3px 11px; cursor:pointer; }
.mig-chip .sw { width:10px; height:10px; border-radius:3px; flex:none; }
.mig-chip.on { border-color:var(--accent); color:var(--accent); }
.mig-chip.neutral { cursor:default; }
.mig-arrived { border-top:1px solid var(--grid); margin-top:12px; padding-top:11px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.mig-arrived .lbl { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:3px; width:100%; }
.mig-arrived .mig-chip { font-size:11.5px; padding:2px 9px; font-weight:500; }

/* ---------- region bars ---------- */
.rbars { display:flex; flex-direction:column; gap:7px; }
.rrow { display:grid; grid-template-columns:170px 1fr 58px; gap:12px; align-items:center; cursor:pointer; border-radius:6px; padding:2px 4px; }
.rrow:hover { background:var(--panel); }
.rrow.sel { background:var(--accent-soft); }
.rrow .rname { font-size:13.5px; font-weight:500; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.rrow.sel .rname { color:var(--accent); font-weight:600; }
.rrow .rbar { display:flex; gap:2px; height:20px; border-radius:4px; overflow:hidden; }
.rrow .seg { height:100%; min-width:1px; }
.rrow .rn { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
@media (max-width:640px){ .rrow{ grid-template-columns:110px 1fr 48px; } }

/* ---------- match tool ---------- */
.match-in { display:flex; gap:10px; flex-wrap:wrap; }
.match-in input { flex:1 1 300px; background:var(--page); border:1px solid var(--border); border-radius:8px; color:var(--ink); font:inherit; padding:9px 13px; font-variant-numeric:tabular-nums; }
.match-in input:focus { outline:2px solid var(--accent); outline-offset:1px; }
.match-in button { border:0; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; border-radius:8px; padding:9px 20px; cursor:pointer; }
.match-out { margin-top:16px; }
.match-out .none { color:var(--muted); }
.snp { display:inline-block; background:var(--panel); border-radius:5px; padding:1px 7px; font-size:12.5px; font-weight:500; color:var(--ink2); font-variant-numeric:tabular-nums; }
.snp.hit { background:var(--accent-soft); color:var(--accent); font-weight:600; }

/* ---------- table ---------- */
table.samples { width:100%; border-collapse:collapse; font-size:13.5px; }
table.samples th { text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--grid); padding:8px 10px; white-space:nowrap; }
table.samples td { border-bottom:1px solid var(--grid); padding:7px 10px; vertical-align:top; }
table.samples tr:hover td { background:var(--panel); }
table.samples .dimc { color:var(--muted); }
table.samples .chaincell { font-variant-numeric:tabular-nums; color:var(--ink2); }
table.samples .chaincell b { color:var(--ink); font-weight:600; }
table.samples .hapdot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:7px; }
.pager { display:flex; align-items:center; gap:14px; margin-top:14px; }
.pager button { border:1px solid var(--border); background:var(--surface); color:var(--ink2); font:inherit; font-weight:600; font-size:13px; border-radius:7px; padding:5px 14px; cursor:pointer; }
.pager button:disabled { opacity:.35; cursor:default; }
.pager .pinfo { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

/* ---------- tooltip ---------- */
#tip { position:fixed; z-index:99; pointer-events:none; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow); padding:9px 12px; font-size:13px; max-width:290px; opacity:0; transition:opacity .1s; }
#tip .t { font-weight:600; margin-bottom:2px; }
#tip .s { color:var(--ink2); }
#tip .rowline { display:flex; align-items:center; gap:7px; margin-top:3px; }
#tip .rowline .sw { width:9px; height:9px; border-radius:3px; flex:none; }
#tip .rowline .n { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink2); padding-left:14px; }

footer.src { color:var(--muted); font-size:13px; margin-top:8px; }
footer.src a { color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; }
/* stacked layout: story flows under the map, no inner scroll */
@media (max-width:1020px){ .mig-story { max-height:none; overflow-y:visible; } }

/* ---------- phone ---------- */
@media (max-width: 640px) {
  .wrap { padding:0 14px 56px; }
  header.hero { padding:26px 0 6px; }
  .card { padding:16px 14px 18px; }
  .stat { padding:10px 14px; }
  .stat .v { font-size:24px; }
  /* 16px inputs stop iOS Safari from zooming in on focus */
  .filters input[type=search], .filters select, .match-in input { font-size:16px; }
  .mig-stops { flex-wrap:wrap; justify-content:flex-start; gap:2px 12px; }
  .mig-stops button { font-size:10.5px; padding:2px 0; }
  .crumbs { font-size:12px; }
  table.samples { font-size:12.5px; }
  .rrow { grid-template-columns:96px 1fr 44px; gap:8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
button:focus-visible, .rrow:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>

<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1>Rrënjët Explorer</h1>
      <p class="sub" data-i="subtitle-html"></p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="lang-sq">Shqip</button><button id="lang-en">English</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="row1">
      <input type="search" id="q" />
      <span id="country-chips" style="display:flex;gap:8px;flex-wrap:wrap;"></span>
      <select id="fis-sel"></select>
      <button class="clear-btn" id="clear-btn" data-i="clear"></button>
    </div>
    <div class="active-chips" id="active-chips"></div>
  </div>

  <div class="grid2">
    <section class="card">
      <h2 data-i="tree-title"></h2>
      <p class="desc" data-i="tree-desc"></p>
      <div class="crumbs" id="crumbs"></div>
      <svg id="sunburst" viewBox="0 0 640 560" role="img"></svg>
      <div class="fis-panel" id="fis-panel"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <h2 data-i="map-title"></h2>
      <p class="desc" data-i="map-desc"></p>
      <svg id="map" viewBox="0 0 640 640" role="img"></svg>
    </section>
  </div>

  <section class="card">
    <h2 data-i="chrono-title"></h2>
    <p class="desc" data-i="chrono-desc"></p>
    <div class="scroll-x"><svg id="chrono" role="img"></svg></div>
    <p class="desc" style="margin-top:10px" data-i="chrono-note"></p>
  </section>

  <section class="card">
    <h2 data-i="mig-title"></h2>
    <p class="desc" data-i="mig-desc"></p>
    <div class="mig-slider">
      <input type="range" id="mig-range" min="0" max="8" step="1" value="0" aria-label="Era">
      <div class="mig-stops" id="mig-stops"></div>
    </div>
    <div class="mig-grid">
      <div class="scroll-x"><svg id="migmap" viewBox="0 0 720 560" role="img"></svg></div>
      <div class="mig-story" id="mig-story"></div>
    </div>
    <p class="desc" style="margin-top:10px" data-i="mig-note"></p>
  </section>

  <section class="card">
    <h2 data-i="regions-title"></h2>
    <p class="desc" data-i="regions-desc"></p>
    <div class="rbars" id="rbars"></div>
  </section>

  <section class="card">
    <h2 data-i="match-title"></h2>
    <p class="desc" data-i="match-desc"></p>
    <div class="match-in">
      <input id="match-q" spellcheck="false" />
      <button id="match-btn" data-i="match-btn"></button>
    </div>
    <div class="match-out" id="match-out"></div>
  </section>

  <section class="card">
    <h2 data-i="table-title"></h2>
    <p class="desc" id="table-count"></p>
    <div class="scroll-x">
      <table class="samples">
        <thead><tr>
          <th data-i="th-hap"></th><th data-i="th-surname"></th><th data-i="th-fis"></th>
          <th data-i="th-rreth"></th><th data-i="th-qark"></th><th data-i="th-country"></th><th data-i="th-chain"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="pg-prev">←</button>
      <span class="pinfo" id="pg-info"></span>
      <button id="pg-next">→</button>
    </div>
  </section>

  <footer class="src" data-i="footer-html"></footer>
</div>
<div id="tip"></div>

  const fisSel = document.getElementById("fis-sel");
  const byF = Array.from(d3.rollup(samples.filter(s=>s.fis), v=>v.length, s=>s.fis)).sort((a,b)=>b[1]-a[1]);

  if (state.q) chips.push(["q", "“"+state.q+"”"]);

}

/* ============ lineage tree (sunburst) ============ */
function buildTree(data){
  const root = { name:"root", children:new Map(), end:0, fis:{} };
  for (const s of data){
    let node = root;
    for (const snp of s.chain){
      if (!node.children.has(snp)) node.children.set(snp, { name:snp, children:new Map(), end:0, fis:{} });
      node = node.children.get(snp);
      if (s.fis) node.fis[s.fis] = (node.fis[s.fis]||0) + 1;
    }
    node.end++;
  }
  return root;
}
const toObj = n => ({ name:n.name, end:n.end, fis:n.fis, children:Array.from(n.children.values()).map(toObj) });

/* Fis written on the arc ONLY where the fis↔branch link is documented on rrenjet.com
   (fis articles, lineage articles, or keymaster forum posts) AND the branch is
   dominated by that fis in the database. Curated 2026-08-19; re-audited 2026-08-20
   against the full article texts, not just proximity matches. */
const FIS_NODES = {
  /* — the Y126399 trunk (article gashi-i-gurit-nikaj-krasniqe): one man ~700-900 y ago
       fathered both branches; fis identities NEST — a later tribe's label sits inside
       its parent branch. Nikaj split out of the Krasniqi founding line (~600-700 y),
       so "Nikaj" nests under the "Krasniqe" label. Z38299 is a broad umbrella — no label. — */
  "Y252971":"Gashi i Gurit", /* J2b — the elder branch; forum #3847 "trungu i gashit të vjetër" */
  "Y229494":"Krasniqe",      /* J2b — the Krasniqi founding line (Kolmekshi, Hysenmekshi, Kolgeci);
                                Nikaj later split from it and nests below */
  "Y229591":"Nikaj",         /* J2b — split out of Krasniqe ~600-700 y ago */
  "Y236853":"Kastrat",       /* J2b — pure Kastrat node under Z38299>FT134628 (FT134628 is mixed) */
  "Y21878":"Hot",            /* J2b — fisi-hot: "linja kryesore e Hotit" Y21878>FT125046>FT124983 */
  "CTS8786":"Shkrel",        /* J2b — fisi-shkrel: Shkreli = Y23094>Y82533>CTS8786 (Y23094 is shared) */
  "Y91573":"Berishë",        /* E-V13 — berisha: "rezultatet nga fisi Berishë i takojnë Y93102>Y91573" */
  "Z16988":"Kelmend",        /* E-V13 — rezultatet 2021 rows; dominant Kelmend branch */
  "Y282207":"Thaç",          /* E-V13 — e-ph2180: Thaçi i Pukës under Y30588 */
  "Y230317":"Gash-Bardhë",   /* E-V13 — e-ph2180: "Gashi i Bardhë, Shipshani" */
  "Y194482":"Berishë e Kuqe",/* E-V13 — e-ph2180 + forum #3701 */
  "FT70142":"Sop",           /* E-V13 — berisha: "Y93102>FT70142, familje Sop dhe Morinë" */
  "BY168279":"Triesh",       /* E-V13 — forum fiset-malesore: the Kuçi/Triesh line, TMRCA ~700 vjet;
                                DB samples on it are Triesh families */
  "BY20093":"Kthellë",       /* E-V13 — article selita */
  "A24000":"Bytyç",          /* R1b — fisi-bytyc: BY611>Z2705>A24000, Bytyçi i Malësisë */
  "A41146":"Thaç-Zogaj",     /* R1b — article trungu-gjenetik-i-zogajve: "A41146 i takon vetëm Zogajve" */
  "Y83965":"Shalë",          /* R1b PF7563 — forum #4031: "shalen në malet e dukagjinit" */
  /* dropped after re-audit: Z38299="Krasniqe" (umbrella over all three tribes + Kastrat etc.),
     Y257550="Çidhën" (article j-y82533: that branch is also in Labëri and Greece) */
};
function fisLine(fisObj){
  const entries = Object.entries(fisObj||{}).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return "";
  const shown = entries.slice(0,4).map(([f,c])=>`${esc(f)} (${c})`).join(", ");
  const more = entries.length - 4;
  return `<div class="s" style="margin-top:3px"><b>${L("th-fis")}:</b> ${shown}${more>0?` +${more}`:""}</div>`;
}

function renderSunburst(){
  const data = filteredNoLin();
  const tree = buildTree(data);
  /* locate current root along state.lineage */
  let cur = tree, path = [];
  for (const snp of state.lineage){
    const nxt = cur.children.get(snp);
    if (!nxt) break;
    cur = nxt; path.push(snp);
  }
  state.lineage = path; /* trim if data no longer contains it */

  /* breadcrumbs */
  const cr = document.getElementById("crumbs");
  let html = `<button data-d="0">${L("crumb-root")}</button>`;
  path.forEach((snp,i) => {
    html += `<span class="sep">›</span>` + (i===path.length-1
      ? `<span class="here">${esc(snp)}</span>`
      : `<button data-d="${i+1}">${esc(snp)}</button>`);
  });
  cr.innerHTML = html;
  cr.querySelectorAll("button").forEach(b => b.onclick = () => { state.lineage = path.slice(0, +b.dataset.d); update(); });

  const H = d3.hierarchy(toObj(cur), d=>d.children).sum(d=>d.end).sort((a,b)=>b.value-a.value);
  const MAXD = 4;
  const W = 640, HT = 560, R = Math.min(W,HT)/2 - 8, R0 = 62;
  d3.partition().size([2*Math.PI, MAXD])(H);

  const svg = d3.select("#sunburst");
  svg.selectAll("*").remove();
  const g = svg.append("g").attr("transform",`translate(${W/2},${HT/2})`);
  const rScale = d => R0 + (R-R0) * d/MAXD;
  const arc = d3.arc()
    .startAngle(d=>d.x0).endAngle(d=>d.x1)
    .padAngle(d=>Math.min((d.x1-d.x0)/2, .004)).padRadius(R)
    .innerRadius(d=>rScale(d.depth-1)).outerRadius(d=>rScale(d.depth)-1.5);

  /* color: hue from top haplogroup of the branch; fade toward surface with depth */
  const surface = css("--surface");
  function fillOf(d){
    let topName;
    if (path.length) topName = path[0];
    else { let n = d; while (n.depth > 1) n = n.parent; topName = n.data.name; }
    const base = hapColor(topName) || css("--sO");   /* hapColor falls back to --sO for non-top8 */
    const rel = d.depth - 1;                          /* 0 for the first visible ring */
    return d3.interpolateLab(d3.lab(base), surface)(Math.min(rel * 0.14, 0.55));
  }

  const nodes = H.descendants().filter(d => d.depth>0 && d.depth<=MAXD && (d.x1-d.x0) > 0.0015);
  g.selectAll("path.arc").data(nodes).join("path")
    .attr("class","arc")
    .attr("d", arc)
    .attr("fill", fillOf)
    .on("mousemove", (ev,d) => {
      const seq = path.concat(d.ancestors().reverse().slice(1).map(n=>n.data.name));
      showTip(`<div class="t">${esc(seq.join(" › "))}</div><div class="s">${d.value.toLocaleString()} ${L("samples-shown")} · ${(100*d.value/H.value).toFixed(1)}%</div>${fisLine(d.data.fis)}`, ev);
    })
    .on("mouseleave", hideTip)
    .on("click", (ev,d) => {
      hideTip();
      state.lineage = path.concat(d.ancestors().reverse().slice(1).map(n=>n.data.name));
      update();
    });

  /* radial labels on arcs that have room: SNP code + dominant clan when it fits */
  g.selectAll("g.arcl").data(nodes.filter(d => (d.x1-d.x0) > 0.055 && (rScale(d.depth)-rScale(d.depth-1)) > 24)).join("g")
    .attr("class","arcl")
    .attr("transform", d => {
      const a = (d.x0+d.x1)/2 * 180/Math.PI - 90, r = (rScale(d.depth-1)+rScale(d.depth))/2;
      return `rotate(${a}) translate(${r},0) rotate(${a > 90 ? 180 : 0})`;
    })
    .each(function(d){
      const el = d3.select(this);
      const rmid = (rScale(d.depth-1)+rScale(d.depth))/2;
      const hpx = (d.x1-d.x0) * rmid;             /* angular room in px at mid radius */
      const fisLbl = FIS_NODES[d.data.name];
      const two = hpx > 24 && !!fisLbl;
      const name = d.data.name.length > 11 ? d.data.name.slice(0,10)+"…" : d.data.name;
      el.append("text").attr("text-anchor","middle")
        .attr("dy", two ? "-0.15em" : "0.35em")
        .attr("fill", css("--ink"))
        .style("font-size","11px").style("font-weight","600")
        .text(name);
      if (two){
        el.append("text").attr("text-anchor","middle")
          .attr("dy", "0.95em")
          .attr("fill", css("--ink")).attr("opacity",.75)
          .style("font-size","9px").style("font-weight","500")
          .text(`(${fisLbl})`);
      }
    });

  /* center */
  const ctr = g.append("g").style("cursor", path.length ? "pointer":"default")
    .on("click", () => { if (path.length){ state.lineage = path.slice(0,-1); update(); } });
  ctr.append("circle").attr("r", R0-4).attr("fill", path.length ? css("--panel") : "transparent")
     .attr("stroke", css("--grid"));
  ctr.append("text").attr("text-anchor","middle").attr("dy","-0.3em")
     .attr("fill", css("--ink")).style("font-weight","600").style("font-size","13px")
     .text(path.length ? (path[path.length-1].length>9?path[path.length-1].slice(0,8)+"…":path[path.length-1]) : L("crumb-root"));
  ctr.append("text").attr("text-anchor","middle").attr("dy","1.05em")
     .attr("fill", css("--muted")).style("font-size","12px")
     .text(H.value.toLocaleString());
  if (path.length) ctr.append("text").attr("text-anchor","middle").attr("dy","2.5em")
     .attr("fill", css("--muted")).style("font-size","10px").text("↩");

  /* legend (top haplogroups, click = jump) */
  const counts = d3.rollup(data, v=>v.length, s=>hapKey(s));
  document.getElementById("legend").innerHTML = HAPS.filter(h=>counts.get(h)).map(h =>
    `<button class="lg ${path.length && path[0]!==h ? "dim":""}" data-h="${esc(h)}"><span class="sw" style="background:var(${hapVar(h===OTHER?"":h)})"></span>${esc(hapLabel(h))}<span class="n">${counts.get(h)}</span></button>`
  ).join("");
  document.querySelectorAll("#legend .lg").forEach(b => b.onclick = () => {
    const h = b.dataset.h;
    if (h===OTHER) return;
    state.lineage = (path.length===1 && path[0]===h) ? [] : [h];
    update();
  });

  /* clans present in the current branch (ignores the fis filter itself, so you can switch) */
  const fisCounts = {};
  for (const s of samples){
    if (!s.fis || !matchesGeo(s) || !matchesQ(s)) continue;
    if (!path.every((snp,i)=>s.chain[i]===snp)) continue;
    fisCounts[s.fis] = (fisCounts[s.fis]||0) + 1;
  }
  const fp = document.getElementById("fis-panel");
  const fentries = Object.entries(fisCounts).sort((a,b)=>b[1]-a[1]);
  if (!fentries.length) fp.innerHTML = "";
  else {
    const MAXF = 12;
    fp.innerHTML = `<span class="fp-label">${L("fis-in-branch")}</span>` +
      fentries.slice(0,MAXF).map(([f,c]) =>
        `<button class="fp-chip ${state.fis===f?"on":""}" data-f="${esc(f)}">${esc(f)}<span class="n">${c}</span></button>`).join("") +
      (fentries.length>MAXF ? `<span class="fp-more">+${fentries.length-MAXF}</span>` : "");
    fp.querySelectorAll(".fp-chip").forEach(b => b.onclick = () => {
      state.fis = state.fis===b.dataset.f ? null : b.dataset.f;
      update();
    });
  }
}

let projection = null;
function renderMapBase(){

  projection = d3.geoMercator().fitExtent([[24,20],[W-24,HT-60]], focus);

  svg.append("g").selectAll("path").data(GEO.features).join("path")
    .attr("d", pathGen)
    .attr("fill", css("--map-land"))
    .attr("stroke", css("--map-line"))

  svg.append("g").selectAll("text").data(labels).join("text")

    .attr("text-anchor","middle")
    .text(d=>d[0]);
  svg.append("g").attr("id","map-pies");
}
function renderMapPies(){
  if (!projection) renderMapBase();
  const data = filteredNoQark();
  const byQ = d3.group(data, s=>s.qark);
  const entries = Array.from(byQ, ([q,v])=>({q, n:v.length, v})).filter(e=>QARK_LL[e.q]).sort((a,b)=>b.n-a.n);
  const rSc = d3.scaleSqrt().domain([1, d3.max(entries,e=>e.n)||1]).range([4.5, 27]);
  const pie = d3.pie().sort(null);
  const surface = css("--surface");
  const g = d3.select("#map-pies");
  g.selectAll("*").remove();
  const grp = g.selectAll("g.qgroup").data(entries, e=>e.q).join("g")
    .attr("class","qgroup")
    .attr("transform", e => { const p = projection(QARK_LL[e.q]); return `translate(${p[0]},${p[1]})`; })
    .attr("opacity", e => state.qark && state.qark !== e.q ? 0.3 : 1);
  grp.each(function(e){
    const counts = HAPS.map(h => e.v.filter(s=>hapKey(s)===h).length);
    const r = rSc(e.n);
    const sel = d3.select(this);
    if (state.qark === e.q)
      sel.append("circle").attr("r", r+3.5).attr("fill","none").attr("stroke", css("--accent")).attr("stroke-width",2);
    sel.selectAll("path").data(pie(counts)).join("path")
      .attr("d", d3.arc().innerRadius(0).outerRadius(r))
      .attr("fill", (d,i)=>hapColor(HAPS[i]===OTHER?"":HAPS[i]) || css("--sO"))
      .attr("stroke", surface).attr("stroke-width", 1.2);
    sel.on("mousemove", ev => {
      const rows = HAPS.map((h,i)=>[h,counts[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
      showTip(`<div class="t">${esc(e.q)}</div><div class="s">${e.n.toLocaleString()} ${L("samples-shown")}</div>` +
        rows.map(([h,n])=>`<div class="rowline"><span class="sw" style="background:${hapColor(SLOT[h]?h:"")||css("--sO")}"></span>${esc(hapLabel(h))}<span class="n">${n}</span></div>`).join(""), ev);
    }).on("mouseleave", hideTip)
      .on("click", () => { hideTip(); state.qark = state.qark===e.q ? null : e.q; update(); });
  });
}

const fmtYear = y => y < 0 ? `${-y} ${lang==="sq"?"p.e.s.":"BC"}` : `${y} ${lang==="sq"?"e.s.":"AD"}`;

function renderChrono(){
  const svg = d3.select("#chrono");
  svg.selectAll("*").remove();
  const W=1000, rowH=30, topPad=40, nRows=CHRONO.length,
        plotX0=104, plotX1=926, yBot=topPad+nRows*rowH, H=yBot+30;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  const x = d3.scaleLinear().domain([-8000,-2600,2025])
              .range([plotX0, plotX0+(plotX1-plotX0)*0.24, plotX1]);

  /* era bands */
  const eb = svg.append("g");
  ERAS.forEach((e,i)=>{
    const x0=x(e.from), x1=x(e.to);
    if (i%2===0) eb.append("rect").attr("x",x0).attr("y",topPad).attr("width",x1-x0)
      .attr("height",nRows*rowH).attr("fill",css("--panel")).attr("opacity",.55);
    eb.append("line").attr("x1",x0).attr("x2",x0).attr("y1",topPad).attr("y2",yBot)
      .attr("stroke",css("--grid"));
    eb.append("text").attr("class","era-label").attr("x",(x0+x1)/2).attr("y",topPad-22)
      .attr("text-anchor","middle").text((e[lang]||e.sq).toUpperCase());
    if (i>0) eb.append("text").attr("class","yr-label").attr("x",x0).attr("y",yBot+16)
      .attr("text-anchor","middle").text(fmtYear(e.from));
  });
  eb.append("line").attr("x1",x(1912)).attr("x2",x(1912)).attr("y1",topPad).attr("y2",yBot).attr("stroke",css("--grid"));

  const counts = d3.rollup(samples, v=>v.length, s=>s.top);
  const selTop = state.lineage.length ? state.lineage[0] : null;

  CHRONO.forEach((c,i)=>{
    const path = c.noclick ? null : (c.sub ? [c.top, c.sub] : [c.top]);
    const n = c.count ? samples.filter(c.count).length
            : c.sub ? samples.filter(s=>s.top===c.top && s.chain[1]===c.sub).length
            : (counts.get(c.top)||0);
    const disp = c.label || c.top;
    const pctN = 100*n/N, pct = pctN < 1 ? pctN.toFixed(1) : Math.round(pctN);
    const cy = topPad + i*rowH + rowH/2;
    const col = hapColor(c.top) || css("--sO");
    const sel = path !== null && JSON.stringify(state.lineage)===JSON.stringify(path);
    const g = svg.append("g")
      .attr("class","crow" + (sel?" sel":"") + (selTop && selTop!==c.top ? " dim":""))
      .attr("tabindex",0).attr("role","button");
    /* label */
    g.append("text").attr("class","cname").attr("x",96).attr("y",cy+4).attr("text-anchor","end").text(disp);
    /* presence line to today */
    g.append("line").attr("x1",x(c.to)).attr("x2",x(2025)).attr("y1",cy).attr("y2",cy)
      .attr("stroke",col).attr("stroke-width",2.5).attr("opacity",.4);
    /* arrival window bar */
    if (c.open){
      const gid = "fade"+i;
      const gr = svg.append("defs").append("linearGradient").attr("id",gid);
      gr.append("stop").attr("offset","0%").attr("stop-color",col).attr("stop-opacity",0);
      gr.append("stop").attr("offset","100%").attr("stop-color",col).attr("stop-opacity",1);
      g.append("rect").attr("x",x(c.from)).attr("y",cy-6).attr("width",x(c.to)-x(c.from)).attr("height",12)
        .attr("rx",4).attr("fill",`url(#${gid})`);
    } else {
      g.append("rect").attr("x",x(c.from)).attr("y",cy-6).attr("width",Math.max(x(c.to)-x(c.from),8)).attr("height",12)
        .attr("rx",4).attr("fill",col).attr("opacity", c.wide ? .5 : 1);
    }
    if (sel) g.append("rect").attr("x",x(c.from)-3).attr("y",cy-9).attr("width",Math.max(x(c.to)-x(c.from),8)+6).attr("height",18)
      .attr("rx",7).attr("fill","none").attr("stroke",css("--accent")).attr("stroke-width",1.6);
    /* expansion burst ✳ */
    if (c.burst){
      const bx = x(c.burst), r = 6;
      const star = g.append("g");
      for (let a=0; a<180; a+=45)
        star.append("line")
          .attr("x1",bx-r*Math.cos(a*Math.PI/180)).attr("y1",cy-r*Math.sin(a*Math.PI/180))
          .attr("x2",bx+r*Math.cos(a*Math.PI/180)).attr("y2",cy+r*Math.sin(a*Math.PI/180))
          .attr("stroke",col).attr("stroke-width",1.8);
      star.append("circle").attr("cx",bx).attr("cy",cy).attr("r",2.4).attr("fill",col)
        .attr("stroke",css("--surface")).attr("stroke-width",1);
    }
    /* count pill */
    g.append("text").attr("class","cpill").attr("x",934).attr("y",cy+4).text(`${n} · ${pct}%`);
    /* hit area + interaction */
    g.append("rect").attr("x",0).attr("y",cy-rowH/2).attr("width",W).attr("height",rowH).attr("fill","transparent");
    const tipHtml = () => {
      let when = `${L("chrono-arrival")}: ~${fmtYear(c.from)} – ${fmtYear(c.to)}` + (c.open ? ` (${L("chrono-earlier")})` : "");
      if (c.burst) when += ` · ✳ ${L("chrono-expansion")} ~${fmtYear(c.burst)}`;
      return `<div class="t">${esc(disp)} — ${n} (${pct}%)</div><div class="s">${esc(when)}</div><div class="s" style="margin-top:4px">${esc(c.story[lang]||c.story.sq)}</div>`;
    };
    const act = () => { if (!path) return; hideTip(); state.lineage = sel ? [] : path; update(); };
    g.on("mousemove", ev => showTip(tipHtml(), ev)).on("mouseleave", hideTip).on("click", act);
    g.on("keydown", ev => { if (ev.key==="Enter"||ev.key===" ") { ev.preventDefault(); act(); } });
  });
}

let migIdx = 0;
function renderMig(){
  const era = MIG[migIdx];
  /* slider stop labels */
  document.getElementById("mig-stops").innerHTML = MIG.map((e,i) =>
    `<button class="${i===migIdx?"on":""}" data-i="${i}">${esc(e.short[lang]||e.short.sq)}</button>`).join("");
  document.querySelectorAll("#mig-stops button").forEach(b => b.onclick = () => { migIdx=+b.dataset.i; document.getElementById("mig-range").value=migIdx; renderMig(); });
  document.getElementById("mig-range").value = migIdx;

  /* ---- map ---- */
  const svg = d3.select("#migmap");
  svg.selectAll("*").remove();
  const W=720, H=560;
  const proj = d3.geoConicEqualArea().parallels([38,56]).rotate([-18,0]);
  proj.fitExtent([[6,6],[W-6,H-6]], {type:"Polygon", coordinates:[[[-11,34],[-11,62],[45,62],[45,34],[-11,34]]]});
  proj.clipExtent([[0,0],[W,H]]);
  const pathGen = d3.geoPath(proj);
  svg.append("path").attr("class","land").attr("d", pathGen(window.__EUROPE__));

  const zg = svg.append("g");
  for (const z of era.zones){
    const ring = z.ring.concat([z.ring[0]]);
    zg.append("path").attr("class","zone-"+z.type).attr("d", pathGen({type:"Polygon", coordinates:[ring]}));
    const p = proj(z.at);
    zg.append("text").attr("class","zone-label").attr("x",p[0]).attr("y",p[1]).attr("text-anchor","middle").text((z.label[lang]||z.label.sq));
  }
  for (const lb of (era.labels||[])){
    const p = proj(lb.at);
    zg.append("text").attr("class","zone-label").attr("x",p[0]).attr("y",p[1]).attr("text-anchor","middle").attr("opacity",.75).text(lb.label[lang]||lb.label.sq);
  }

  const ag = svg.append("g");
  const line = d3.line().curve(d3.curveCatmullRom.alpha(.8));
  for (const a of era.arrows){
    const col = a.clade ? (hapColor(a.clade)||css("--sO")) : css("--ink2");
    const pts = a.pts.map(p=>proj(p));
    ag.append("path").attr("d", line(pts)).attr("fill","none")
      .attr("stroke",col).attr("stroke-width",2.6).attr("stroke-linecap","round")
      .attr("stroke-dasharray", a.dashed ? "7 5" : null).attr("opacity",.92);
    /* arrowhead from final segment direction */
    const [x1,y1] = pts[pts.length-2], [x2,y2] = pts[pts.length-1];
    const ang = Math.atan2(y2-y1, x2-x1), s=8;
    ag.append("path").attr("fill",col).attr("opacity",.92)
      .attr("d",`M${x2},${y2} L${x2-s*Math.cos(ang-0.45)},${y2-s*Math.sin(ang-0.45)} L${x2-s*Math.cos(ang+0.45)},${y2-s*Math.sin(ang+0.45)} Z`);
    const lbl = typeof a.label==="string" ? a.label : (a.label[lang]||a.label.sq);
    if (lbl){
      const mid = pts[a.li !== undefined ? a.li : Math.max(0, Math.floor(pts.length/2)-1)];
      ag.append("text").attr("class","arrow-label").attr("x",mid[0]+6).attr("y",mid[1]-7).text(lbl);
    }
  }
  for (const m of (era.marks||[])){
    const p = proj(m.at), col = hapColor(m.clade)||css("--accent");
    const st = svg.append("g");
    for (let d=0; d<180; d+=45)
      st.append("line").attr("x1",p[0]-7*Math.cos(d*Math.PI/180)).attr("y1",p[1]-7*Math.sin(d*Math.PI/180))
        .attr("x2",p[0]+7*Math.cos(d*Math.PI/180)).attr("y2",p[1]+7*Math.sin(d*Math.PI/180))
        .attr("stroke",col).attr("stroke-width",2);
    st.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",2.6).attr("fill",col).attr("stroke",css("--page")).attr("stroke-width",1);
    st.append("text").attr("class","arrow-label").attr("x",p[0]+11).attr("y",p[1]+4).text(m.label[lang]||m.label.sq);
  }

  /* on narrow screens the map overflows its container — start scrolled to the Balkans */
  const sc = document.getElementById("migmap").parentElement;
  if (sc.scrollWidth > sc.clientWidth) sc.scrollLeft = sc.scrollWidth*0.54 - sc.clientWidth/2;

  /* ---- story panel ---- */
  const chipHtml = c => {
    if (!c) return "";
    const on = state.lineage.length && state.lineage[0]===c;
    return `<button class="mig-chip ${on?"on":""}" data-clade="${esc(c)}"><span class="sw" style="background:${hapColor(c)||css("--sO")}"></span>${esc(c)}</button>`;
  };
  const st = document.getElementById("mig-story");
  st.innerHTML =
    `<h3>${esc(era.title[lang]||era.title.sq)}</h3><div class="yrs">${esc(era.yrs[lang]||era.yrs.sq)}</div>` +
    `<p class="summ">${esc(era.summary[lang]||era.summary.sq)}</p>` +
    era.stories.map(s => {
      const head = s.clade ? chipHtml(s.clade) : `<span class="mig-chip neutral">${esc((s.title&&(s.title[lang]||s.title.sq))||"·")}</span>`;
      const extra = (s.clade && s.title) ? ` <span style="font-size:12.5px;font-weight:600">${esc(s.title[lang]||s.title.sq)}</span>` : "";
      return `<div class="mstory">${head}${extra}<p>${esc(s.text[lang]||s.text.sq)}</p></div>`;
    }).join("") +
    `<div class="mig-arrived"><span class="lbl">${L("mig-arrived")}</span>` +
      era.arrived.map(chipHtml).join("") + `</div>`;
  st.querySelectorAll(".mig-chip[data-clade]").forEach(b => b.onclick = () => {
    const c = b.dataset.clade;
    state.lineage = (state.lineage.length===1 && state.lineage[0]===c) ? [] : [c];
    update();
  });
}
document.getElementById("mig-range").addEventListener("input", ev => { migIdx = +ev.target.value; renderMig(); });

/* ============ region bars ============ */
function renderBars(){
  const data = filteredNoQark();
  const byQ = Array.from(d3.group(data, s=>s.qark), ([q,v])=>({q, n:v.length, v})).sort((a,b)=>b.n-a.n);
  const TOPN = 16;
  const rows = byQ.slice(0, TOPN);
  const rest = byQ.slice(TOPN);
  if (rest.length) rows.push({ q:null, n:d3.sum(rest,r=>r.n), v:rest.flatMap(r=>r.v) });
  const el = document.getElementById("rbars");
  el.innerHTML = rows.map(r => {
    const counts = HAPS.map(h=>r.v.filter(s=>hapKey(s)===h).length);
    const segs = counts.map((n,i)=> n ? `<div class="seg" style="flex:${n};background:var(${hapVar(HAPS[i]===OTHER?"":HAPS[i])})"></div>` : "").join("");
    const name = r.q === null ? L("other-regions") : r.q;
    return `<div class="rrow ${r.q!==null && state.qark===r.q?"sel":""}" data-q="${r.q===null?"":esc(r.q)}" tabindex="0" role="button">
      <div class="rname">${esc(name)}</div><div class="rbar">${segs}</div><div class="rn">${r.n.toLocaleString()}</div></div>`;
  }).join("");
  el.querySelectorAll(".rrow").forEach((rowEl, idx) => {
    const r = rows[idx];
    const act = () => { if (r.q===null) return; state.qark = state.qark===r.q ? null : r.q; update(); };
    rowEl.onclick = act;
    rowEl.onkeydown = ev => { if (ev.key==="Enter"||ev.key===" ") { ev.preventDefault(); act(); } };
    rowEl.onmousemove = ev => {
      const pairs = HAPS.map(h=>[h, r.v.filter(s=>hapKey(s)===h).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
      showTip(`<div class="t">${esc(r.q===null?L("other-regions"):r.q)}</div>` +
        pairs.map(([h,n])=>`<div class="rowline"><span class="sw" style="background:${hapColor(SLOT[h]?h:"")||css("--sO")}"></span>${esc(hapLabel(h))}<span class="n">${n} · ${(100*n/r.n).toFixed(0)}%</span></div>`).join(""), ev);
    };
    rowEl.onmouseleave = hideTip;
  });
}

/* ============ table ============ */
let page = 0; const PER = 20;
function renderTable(){
  const f = filtered();
  const pages = Math.max(1, Math.ceil(f.length / PER));
  if (page >= pages) page = pages - 1;
  const rows = f.slice(page*PER, page*PER+PER);
  const u = L("unknown");
  document.getElementById("tbody").innerHTML = rows.map(s => {
    const chainHtml = s.chain.map((x,i) => i===s.chain.length-1 ? `<b>${esc(x)}</b>` : esc(x)).join(" › ");
    return `<tr>
      <td><span class="hapdot" style="background:var(${hapVar(s.top)})"></span>${esc(s.top)}</td>
      <td>${s.surname?esc(s.surname):`<span class="dimc">${u}</span>`}</td>
      <td>${s.fis?esc(s.fis):`<span class="dimc">${u}</span>`}</td>
      <td>${esc(s.rreth)||u}</td><td>${esc(s.qark)||u}</td><td>${esc(s.country)||u}</td>
      <td class="chaincell">${chainHtml}</td></tr>`;
  }).join("");
  document.getElementById("table-count").textContent = `${f.length.toLocaleString()} ${L("samples-shown")}`;
  document.getElementById("pg-info").textContent = `${L("page")} ${page+1} ${L("of")} ${pages}`;
  document.getElementById("pg-prev").disabled = page===0;
  document.getElementById("pg-next").disabled = page>=pages-1;
}
document.getElementById("pg-prev").onclick = () => { page--; renderTable(); };
document.getElementById("pg-next").onclick = () => { page++; renderTable(); };

/* ============ match tool ============ */
function runMatch(){
  const raw = document.getElementById("match-q").value.trim();
  const out = document.getElementById("match-out");
  if (!raw){ out.innerHTML=""; return; }
  const tokens = raw.split(/[>|,;\s]+/).filter(Boolean).map(t=>t.toUpperCase());
  const bare = t => t.replace(/^[A-Z][0-9]*[AB]?-/i,"").toUpperCase();
  const tokSet = tokens.map(t => [t, bare(t)]);
  const scored = [];
  for (const s of samples){
    const up = s.chain.map(x=>x.toUpperCase());
    const upBare = up.map(bare);
    let hits = [], deepest = -1;
    for (const [t,tb] of tokSet){
      let idx = up.indexOf(t); if (idx<0) idx = upBare.indexOf(tb);
      if (idx>=0){ hits.push(idx); deepest = Math.max(deepest, idx); }
    }
    if (hits.length) scored.push({ s, hits:new Set(hits), n:hits.length, deepest });
  }
  scored.sort((a,b) => b.n - a.n || b.deepest - a.deepest || b.s.chain.length - a.s.chain.length);
  if (!scored.length){ out.innerHTML = `<p class="none">${L("match-none")}</p>`; return; }
  const top = scored.slice(0, 15);
  const u = L("unknown");
  out.innerHTML = `<div class="scroll-x"><table class="samples"><thead><tr>
      <th>${L("match-shared")}</th><th>${L("th-fis")}</th><th>${L("th-rreth")}</th><th>${L("th-qark")}</th><th>${L("th-country")}</th><th>${L("th-chain")}</th>
    </tr></thead><tbody>` +
    top.map(({s,hits,n}) => `<tr>
      <td style="font-variant-numeric:tabular-nums"><b>${n}</b> / ${tokens.length}</td>
      <td>${s.fis?esc(s.fis):`<span class="dimc">${u}</span>`}</td>
      <td>${esc(s.rreth)||u}</td><td>${esc(s.qark)||u}</td><td>${esc(s.country)||u}</td>
      <td>${s.chain.map((x,i)=>`<span class="snp ${hits.has(i)?"hit":""}">${esc(x)}</span>`).join(" ")}</td>
    </tr>`).join("") + `</tbody></table></div>` +
    (scored.length>15 ? `<p class="desc" style="margin-top:10px">+ ${scored.length-15} …</p>` : "");
}
document.getElementById("match-btn").onclick = runMatch;
document.getElementById("match-q").addEventListener("keydown", ev => { if (ev.key==="Enter") runMatch(); });

/* ============ wiring ============ */
let qTimer = null;
document.getElementById("q").addEventListener("input", ev => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = ev.target.value.trim(); update(); }, 250);
});
document.getElementById("clear-btn").onclick = () => {
  state.lineage=[]; state.qark=null; state.country=null; state.fis=null; state.q="";
  document.getElementById("q").value="";
  update();
};
document.getElementById("lang-sq").onclick = () => { lang="sq"; saveLang("sq"); renderStatic(); update(); };
document.getElementById("lang-en").onclick = () => { lang="en"; saveLang("en"); renderStatic(); update(); };

function update(){
  page = 0;
  renderStats();
  renderFilterBar();
  renderSunburst();
  renderMapPies();
  renderChrono();
  renderMig();
  renderBars();
  renderTable();
}

/* re-render charts when theme flips (colors are read from CSS vars at render time) */
const reTheme = () => { projection=null; renderMapBase(); update(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reTheme);
new MutationObserver(muts => { if (muts.some(m=>m.attributeName==="data-theme")) reTheme(); })
  .observe(document.documentElement, { attributes:true });

renderStatic();
renderMapBase();
update();
})();
</script>
